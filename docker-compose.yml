services:
  dc-formatter:
    build:
      context: .
      dockerfile: Dockerfile
    # user: "1000:1000"  # Run as non-root user (uid:gid)
    image: dc-formatter:latest
    container_name: dc-formatter
    ports:
      - "8000:8000"
    volumes:
      # Input documents via upload API
      - ./app/DC_SOURCES:/app/DC_SOURCES
      - ./app/OUTPUT1_XML-RAW:/app/OUTPUT1_XML-RAW
      - ./app/OUTPUT2_JSON-RAW:/app/OUTPUT2_JSON-RAW
      - ./app/OUTPUT3_JSON-TRANSFORMED:/app/OUTPUT3_JSON-TRANSFORMED
      - ./app/OUTPUT4_DOCX-RESULT:/app/OUTPUT4_DOCX-RESULT
      - ./app/OUTPUTS_FORMATTED:/app/OUTPUTS_FORMATTED
    environment:
      # Application configuration
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Resource limits (ajustez selon vos besoins)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  dc-uploads:
    driver: local

networks:
  default:
    name: dc-formatter-network
    external: true
