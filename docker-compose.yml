services:
  dc-formatter:
    build:
      context: .
      dockerfile: Dockerfile
    image: dc-formatter:latest
    container_name: dc-formatter
    ports:
      - "8000:8000"
    volumes:
      # Input documents via upload API
      - ./uploads:/app/DC_SOURCES
      # Output results (corresponds to OUTPUT4_DOCX-RESULT)
      - ./output:/app/OUTPUT4_DOCX-RESULT
    environment:
      # Application configuration
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Resource limits (ajustez selon vos besoins)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  dc-uploads:
    driver: local

networks:
  default:
    name: dc-formatter-network
